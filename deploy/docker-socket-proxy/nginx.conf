user root;
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    default_type application/json;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Connection "";

    upstream docker_daemon {
        server unix:/var/run/docker.sock;
    }

    server {
        listen unix:/run/docker-api/docker.sock;
        server_name _;

        if ($request_method != GET) {
            return 405;
        }

        location = /_ping {
            proxy_pass http://docker_daemon/v1.44/_ping;
        }

        location = /v1.44/_ping {
            proxy_pass http://docker_daemon;
        }

        location = /containers/json {
            proxy_pass http://docker_daemon/v1.44/containers/json;
        }

        location = /v1.44/containers/json {
            proxy_pass http://docker_daemon;
        }

        location = /networks {
            proxy_pass http://docker_daemon/v1.44/networks;
        }

        location = /v1.44/networks {
            proxy_pass http://docker_daemon;
        }

        location / {
            return 403;
        }
    }
}
