# Docker Web Configuration (v0.1)

# Discovery settings
discovery_interval: 30

# Docker connection settings
docker_socket_path: "/var/run/docker.sock"
docker_timeout_seconds: 120

# Server settings
bind_address: "0.0.0.0:3000"

# Logging configuration
logging_level: "info"
log_file_path: "/var/log/docker-web.log"
metrics_log_file_path: "/var/log/docker-web-metrics.log"

# Frontend settings
frontend_theme: "light"
demo_mode: false

# Authentication settings
auth:
  username: "admin"
  password_hash: ~
