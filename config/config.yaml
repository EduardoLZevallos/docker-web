# Docker Web Configuration

# Discovery settings
discovery_interval: 30  # Interval in seconds between container discovery scans

# Docker connection settings
docker_socket_path: "/var/run/docker.sock"  # Path to the Docker socket
reverse_proxy_url: ~  # Optional reverse proxy URL, set to null if not used

# Logging configuration
logging_level: "info"  # Logging level (debug, info, warn, error)
log_file_path: "/var/log/docker-web.log"  # Main application log file
metrics_log_file_path: "/var/log/docker-web-metrics.log"  # Metrics log file

# Frontend settings
frontend_theme: "light"  # Default theme (light or dark)

# Authentication settings
auth:
  username: "admin"  # Default admin username
  password_hash: ~  # Password hash will be set on first run